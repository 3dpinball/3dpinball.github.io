
[sdl]
autolock=true
mouse emulation=integration

[dosbox]
title=Win 3.11
memsize=256

[dos]
hard drive data rate limit=0
floppy drive data rate limit=0

[cpu]
cputype=pentium
core=auto
integration device=true

[pci]
voodoo=false

[sblaster]
sbtype=sb16vibra

[render]
scaler=none

[autoexec]
echo off

imgmount 2 system-win311-v1.qcow2
mount d .
boot c:
echo Please visit our website:
