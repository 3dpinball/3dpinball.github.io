<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theme JSON Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>🎨 Theme JSON Editor</h2>

  <div class="section">
    <input type="file" id="fileInput">
    <button onclick="downloadJSON()">⬇ Download JSON</button>
  </div>

  <div class="section">
    <label>Name</label>
    <input id="nameInput"><br><br>
   <label>Font Family</label>
<select id="fontInput">
  <option value="">-- Select font --</option>
 <option>Andhita</option>
<option>AngerisPixelOutline</option>
<option>Ankora</option>
<option>Balenia</option>
<option>BelovedAngelicaSans</option>
<option>BohoRainbow</option>
<option>Crisvalery</option>
<option>CSRomina</option>
<option>CSTornado</option>
<option>Cartis</option>
<option>Castrela</option>
<option>CharlieKlarisma</option>
<option>DarknightTomorrow</option>
<option>Devliza</option>
<option>EastKindLight</option>
<option>Fantastico</option>
<option>Ficoria</option>
<option>Figken</option>
<option>GlamourCoquette</option>
<option>HenrytaBradley</option>
<option>Hosera</option>
<option>LucentiRomance</option>
<option>Modesta</option>
<option>MartinLangley</option>
<option>Maung</option>
<option>MelodySunday</option>
<option>MelonaWoman</option>
<option>MetroLuxes</option>
<option>MichaelCarsl</option>
<option>Misadon</option>
<option>Monse</option>
<option>Mooulena</option>
<option>Morase</option>
<option>Overides</option>
<option>PottelikaKinetics</option>
<option>Quick</option>
<option>Rimons</option>
<option>RawPixel</option>
<option>RecitalsBrush</option>
<option>Relington</option>
<option>Rocklords</option>
<option>Stirle</option>
<option>Summer</option>
<option>TheChrisera</option>
<option>TheBonesZombie</option>
<option>TheXamber</option>
<option>TornFlesh</option>
<option>Unida</option>
<option>VandalSoulShadow</option>
<option>Viplind</option>
<option>WangorAsfrac</option>
<option>Zukoline</option>


</select>

  </div>



  <div class="section">
    <h3>🎨 Colors (Old / New / Code + Bulk Paste)</h3>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">

      <div id="colors" class="multi-column"></div>

      <div>
        <label>📋 Paste color JSON block:</label><br>
        <textarea id="bulkColors" class="bulk-box"
placeholder='"windowBackground": "#C0C0C0",
"panelBackground": "#E0E0E0",
"accent": "#000080"'></textarea><br><br>
        <button onclick="applyBulkColors()">Apply Colors</button>
      </div>

    </div>
  </div>
  <div class="section">

    <label>🖊 Global SVG Stroke Color</label>
    <input type="color" id="globalStrokeColor">
    <label>🎨 Global SVG Fill Color</label>
    <input type="color" id="globalFillColor">

    <button onclick="clearGlobalSvgColor()">Reset</button>
  </div>
  <div class="section">
    <h3>🖼 Icons (Old → New SVG)</h3>
    <div id="icons" class="multi-column"></div>
  </div>
</div>

<!-- PAINT PREVIEW -->
<div class="preview-panel">
  <div id="preview" class="paint-preview"></div>
</div>
<div id="svgCreatorModal" class="svg-modal hidden">
  <div class="svg-editor">
    <h3>✏️ Draw Icon (32×32)</h3>

    <!-- TOOLBAR -->
    <div class="svg-toolbar">
      <input type="color" id="svgBrushColor" value="#000000">
<label>Opacity</label>
<input type="range" id="svgBrushAlpha" min="0" max="1" step="0.01" value="1">
<span id="alphaValue">1</span>


    <input type="file" id="svgImageInput" accept="image/*" hidden>
  <button onclick="document.getElementById('svgImageInput').click()">📷 Upload</button>
    </div>

    <canvas id="svgCanvas" width="256" height="256"></canvas>

    <div class="svg-controls">
      <button onclick="SvgCreator.clear()">Clear</button>
      <button onclick="SvgCreator.undo()">Undo</button>
      <button onclick="SvgCreator.confirm()">OK</button>
      <button onclick="SvgCreator.close()">Cancel</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="svg_creator.js"></script>
<script>
  SvgCreator.init();
</script>
</body>
</html>
