<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theme JSON Editor</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
}
.container {
  padding: 15px;
  max-width: 1800px;
  margin: auto;
}
.section {
  background: #1e293b;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}
label {
  font-size: 12px;
  color: #cbd5f5;
}
input[type=text] {
  width: 120px;
  padding: 4px;
  border-radius: 6px;
  border: none;
}
.color-row, .icon-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.color-preview {
  width: 26px;
  height: 22px;
  border-radius: 4px;
  border: 1px solid #000;
}
.icon-preview {
  width: 48px;
  height: 48px;
  background: #334155;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-preview svg {
  width: 36px;
  height: 36px;
}
.compare-box {
  display: flex;
  gap: 6px;
}
.multi-column {
  column-count: 3;
  column-gap: 16px;
}
.multi-column .color-row,
.multi-column .icon-row {
  break-inside: avoid;
}
.bulk-box {
  width: 100%;
  height: 220px;
  border-radius: 8px;
  border: none;
  padding: 8px;
  font-family: monospace;
}
button {
  padding: 8px 14px;
  background: #38bdf8;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}
@media(max-width:1000px){.multi-column{column-count:2;}}
@media(max-width:600px){.multi-column{column-count:1;}}
</style>
</head>
<body>

<div class="container">
  <h2>🎨 Theme JSON Editor</h2>

  <div class="section">
    <input type="file" id="fileInput">
    <button onclick="downloadJSON()">⬇ Download JSON</button>
  </div>

  <div class="section">
    <label>Name</label>
    <input id="nameInput"><br><br>
    <label>Font Family</label>
    <input id="fontInput">
  </div>

  <!-- GLOBAL SVG COLORS -->
  <div class="section">
    <label>🎨 Global SVG Fill Color</label>
    <input type="color" id="globalFillColor"><br><br>

    <label>🖊 Global SVG Stroke Color</label>
    <input type="color" id="globalStrokeColor">
    <button onclick="clearGlobalSvgColor()">Reset</button>
  </div>

  <!-- COLORS -->
  <div class="section">
    <h3>🎨 Colors (Old / New / Code + Bulk Paste)</h3>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">

      <div id="colors" class="multi-column"></div>

      <div>
        <label>📋 Paste color JSON block:</label><br>
        <textarea id="bulkColors" class="bulk-box"
placeholder='"windowBackground": "#C0C0C0",
"panelBackground": "#E0E0E0",
"accent": "#000080"'></textarea><br><br>
        <button onclick="applyBulkColors()">Apply Colors</button>
      </div>

    </div>
  </div>

  <!-- ICONS -->
  <div class="section">
    <h3>🖼 Icons (Old → New SVG)</h3>
    <div id="icons" class="multi-column"></div>
  </div>

</div>

<script>
let themeData = {};
let oldColors = {};
let oldIcons = {};

let globalFillColor = null;
let globalStrokeColor = null;

/* LOAD JSON */
fileInput.addEventListener("change", e=>{
  const reader = new FileReader();
  reader.onload = ()=>{
    themeData = JSON.parse(reader.result);
    oldColors = JSON.parse(JSON.stringify(themeData.colors));
    oldIcons = JSON.parse(JSON.stringify(themeData.icons));
    renderForm();
  };
  reader.readAsText(e.target.files[0]);
});

/* GLOBAL COLOR EVENTS */
globalFillColor = null;
globalStrokeColor = null;

document.getElementById("globalFillColor").addEventListener("change", e=>{
  globalFillColor = e.target.value;
  renderForm();
});

document.getElementById("globalStrokeColor").addEventListener("change", e=>{
  globalStrokeColor = e.target.value;
  renderForm();
});

function clearGlobalSvgColor(){
  globalFillColor = null;
  globalStrokeColor = null;
  document.getElementById("globalFillColor").value = "#000000";
  document.getElementById("globalStrokeColor").value = "#000000";
  renderForm();
}

/* RENDER FORM */
function renderForm(){
  nameInput.value = themeData.name || "";
  fontInput.value = themeData.fontFamily || "";

  nameInput.oninput = e=> themeData.name = e.target.value;
  fontInput.oninput = e=> themeData.fontFamily = e.target.value;

  // COLORS
  colors.innerHTML="";
  for(let k in themeData.colors){
    colors.innerHTML += `
      <div class="color-row">
        <label style="width:150px">${k}</label>
        <div class="color-preview" style="background:${oldColors[k]}"></div>
        <input type="color" value="${themeData.colors[k]}"
          onchange="updateColor('${k}',this.value)">
        <input type="text" value="${themeData.colors[k]}"
          oninput="updateColor('${k}',this.value)">
      </div>`;
  }
  updateBulkBox();

  // ICONS
  icons.innerHTML="";
  for(let k in themeData.icons){
    if(["defaultSize","strokeWidth","color"].includes(k)){
      icons.innerHTML += `
        <div class="color-row">
          <label style="width:150px">${k}</label>
          <input value="${themeData.icons[k]}"
            oninput="themeData.icons['${k}']=this.value">
        </div>`;
    } else {
      const newSvg = applyGlobalColor(themeData.icons[k]);
      icons.innerHTML += `
        <div class="icon-row">
          <label style="width:140px">${k}</label>
          <div class="compare-box">
            <div class="icon-preview">${oldIcons[k]||""}</div>
            <div class="icon-preview">${newSvg}</div>
          </div>
          <input type="file" accept=".svg" onchange="uploadIcon(event,'${k}')">
        </div>`;
    }
  }
}

/* APPLY GLOBAL FILL & STROKE COLOR (KEEP TRANSPARENT) */
function applyGlobalColor(svgText){
  if(!globalFillColor && !globalStrokeColor) return svgText;

  const parser = new DOMParser();
  const doc = parser.parseFromString(svgText,"image/svg+xml");
  const svg = doc.querySelector("svg");
  const elements = svg.querySelectorAll("*");

  elements.forEach(el=>{
    const fill = el.getAttribute("fill");
    const stroke = el.getAttribute("stroke");

    if(globalFillColor && fill && fill !== "none"){
      el.setAttribute("fill", globalFillColor);
    }
    if(globalStrokeColor && stroke && stroke !== "none"){
      el.setAttribute("stroke", globalStrokeColor);
    }
  });

  return svg.outerHTML.replace(/"/g,"'");
}

/* COLOR UPDATE */
function updateColor(key,value){
  if(!/^#([0-9A-Fa-f]{3}){1,2}$/.test(value)) return;
  themeData.colors[key]=value;
  renderForm();
}

/* BULK BOX */
function updateBulkBox(){
  let text="";
  for(let k in themeData.colors){
    text += `"${k}": "${themeData.colors[k]}",\n`;
  }
  bulkColors.value=text.trim();
}

function applyBulkColors(){
  const lines = bulkColors.value.split("\n");
  lines.forEach(line=>{
    const match = line.match(/"(.+?)"\s*:\s*"(#?[0-9a-fA-F]{3,6})"/);
    if(match){
      const key = match[1];
      const val = match[2];
      if(themeData.colors[key]){
        themeData.colors[key]=val;
      }
    }
  });
  renderForm();
}

/* CLEAN SVG */
function cleanSVG(svgText){
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgText,"image/svg+xml");
  const svg = doc.querySelector("svg");
  if(!svg) return null;
  return svg.outerHTML.replace(/"/g,"'");
}

/* UPLOAD ICON */
function uploadIcon(e,key){
  const reader = new FileReader();
  reader.onload = ()=>{
    const cleaned = cleanSVG(reader.result);
    if(cleaned){
      themeData.icons[key] = cleaned;
      renderForm();
    }
  };
  reader.readAsText(e.target.files[0]);
}

/* FILE NAME */
function slugify(text){
  return text.toLowerCase().trim()
    .replace(/[^a-z0-9\s]/g,"")
    .replace(/\s+/g,"_");
}

/* DOWNLOAD */
function downloadJSON(){
  if(globalFillColor || globalStrokeColor){
    for(let k in themeData.icons){
      if(!["defaultSize","strokeWidth","color"].includes(k)){
        themeData.icons[k] = applyGlobalColor(themeData.icons[k]);
      }
    }
  }

  const fileName = slugify(themeData.name||"theme")+".json";
  const blob = new Blob([JSON.stringify(themeData,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=fileName;
  a.click();
}
</script>

</body>
</html>
